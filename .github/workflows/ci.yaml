name: CI
on:
  # pull_request:
  #   branches:
  #     - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Stage 1: Build matrix (hard gate) ──────────────────────────────
  # Verifies that C# backends (CefSharp on Windows, Electron on all
  # platforms) and the Vite frontend compile without errors. This is the
  # single hard gate — everything downstream waits for build to pass.
  # build_csharp and build_frontend are steps within ONE job so both
  # outputs land in the same artifact upload.
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            csharp-projects: 'Dotnet/VRCX-Cef.csproj Dotnet/VRCX-Electron.csproj'
            label: '(Windows/CefSharp+Electron)'
          - os: ubuntu-latest
            platform: linux
            csharp-projects: 'Dotnet/VRCX-Electron.csproj'
            label: '(Linux/Electron)'
          - os: macos-latest
            platform: linux
            csharp-projects: 'Dotnet/VRCX-Electron.csproj'
            label: '(macOS/Electron)'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build C# (dotnet build)
        shell: bash
        run: |
          for project in ${{ matrix.csharp-projects }}; do
            dotnet build "$project"
          done
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Build frontend
        shell: bash
        run: |
          npx vite build src
          npm run build:licenses
        env:
          PLATFORM: ${{ matrix.platform }}
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: build/
          retention-days: 7

  # ── Stage 2: Quality gate (hard gate, passes when build matrix is green) ──
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Build matrix passed — downstream gates unlocked"

  # ── Stage 2b: Lint + Typecheck (warning only, does not block) ──────
  lint_typecheck:
    name: Lint & Typecheck (warning)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Oxlint
        uses: oxc-project/oxlint-action@v2.0.1
        with:
          config: .oxlintrc.json
        continue-on-error: true
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Typecheck JS
        run: npm run typecheck:js

  # ── Stage 3: Format checks (warning only, depends on build + lint_typecheck) ──
  format_js:
    name: Format JS (warning)
    runs-on: ubuntu-latest
    needs: lint_typecheck
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run format:check

  format_c_sharp:
    name: Format C# (warning)
    runs-on: ubuntu-latest
    needs: lint_typecheck
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check C# formatting
        run: |
          dotnet format whitespace --no-restore --verify-no-changes
          dotnet format style --no-restore --verify-no-changes

  # ── Stage 4: Database integration tests (Windows, hard gate) ───────
  test_mysql:
    name: Test MySQL (${{ matrix.mysql-version }})
    runs-on: windows-latest
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        mysql-version: ['8.0', '8.4']
    env:
      MYSQL_TEST_HOST: 127.0.0.1
      MYSQL_TEST_PORT: 3306
      MYSQL_TEST_USER: root
      MYSQL_TEST_PASSWORD: root
      MYSQL_TEST_DATABASE: vrcx_test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup MySQL ${{ matrix.mysql-version }}
        uses: shogo82148/actions-setup-mysql@076e636c45996ec8cb1a455c65f9f5364aeebd8a # v1.52.1
        with:
          mysql-version: ${{ matrix.mysql-version }}
          root-password: root
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Create test database
        run: mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS vrcx_test;"
      - run: npm test -- --run
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Dotnet read-only rejection tests (MySQL)
        run: dotnet test Dotnet/VRCX.Tests --filter "Category=ReadOnlyRejection"
      - name: Dotnet browse-mode unit tests (MySQL)
        run: dotnet test Dotnet/VRCX.Tests --filter "Category=BrowseMode"

  # Phase 9 slice S12 (task 9.15): PostgreSQL 16/17 integration test matrix.
  # Uses ikalnytskyi/action-setup-postgres to provision PG on the runner
  # (supports Linux/macOS/Windows, no Docker service container needed).
  # Tests self-skip when PG_TEST_HOST is unset, so this job is the only
  # place `*.pgsql.test.js` actually executes.
  test_pgsql:
    name: PgSQL Integration (PG ${{ matrix.pg.version }})
    runs-on: windows-latest
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        pg:
          - { version: "16" }
          - { version: "17" }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Pin to v8 tag SHA (c4dda34, 2025-10-10) for supply-chain safety.
      # Bump by updating SHA + tag comment after reviewing upstream release notes.
      - name: Setup PostgreSQL
        uses: ikalnytskyi/action-setup-postgres@c4dda34aae1c821e3a771b68b73b13af3198a7ee # v8
        id: postgres
        with:
          postgres-version: ${{ matrix.pg.version }}
          username: vrcx
          password: vrcx
          database: vrcx
          port: 5432
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run PgSQL integration tests
        run: npm test -- --run '.pgsql.test.js'
        env:
          PG_TEST_HOST: localhost
          PG_TEST_PORT: 5432
          PG_TEST_USER: vrcx
          PG_TEST_PASSWORD: vrcx
          PG_TEST_DB: vrcx
          PG_TEST_VERSION: ${{ matrix.pg.version }}
          # PGSERVICE enables psql/libpq clients to connect without explicit URI.
          PGSERVICE: ${{ steps.postgres.outputs.service-name }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # step 级 env 复制 PG_TEST_* — 否则 env-gated dotnet 测试静默全 Skip 假绿
      - name: Dotnet read-only rejection tests (PgSQL)
        run: dotnet test Dotnet/VRCX.Tests --filter "Category=ReadOnlyRejection"
        env:
          PG_TEST_HOST: localhost
          PG_TEST_PORT: 5432
          PG_TEST_USER: vrcx
          PG_TEST_PASSWORD: vrcx
          PG_TEST_DB: vrcx
          PG_TEST_VERSION: ${{ matrix.pg.version }}
      - name: Dotnet browse-mode unit tests (PgSQL)
        run: dotnet test Dotnet/VRCX.Tests --filter "Category=BrowseMode"
